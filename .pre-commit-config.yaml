repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: debug-statements

  - repo: local
    hooks:
      - id: sync-smart-battery
        name: sync vendored smart_battery
        language: system
        entry: bash -c 'rsync -a --delete --exclude="__pycache__" smart_battery/ custom_components/foxess_control/smart_battery/ && git add custom_components/foxess_control/smart_battery/'
        pass_filenames: false
        files: ^smart_battery/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: semgrep-architecture
        name: architectural lint (semgrep)
        language: system
        entry: semgrep --config .semgrep/ --error custom_components/foxess_control/ smart_battery/ tests/e2e/
        pass_filenames: false
        files: ^(custom_components/foxess_control/|smart_battery/|tests/e2e/).*\.py$
        types: [python]

      - id: check-module-size
        name: module size budget
        language: script
        entry: .githooks/check-module-size
        pass_filenames: false
        files: ^custom_components/foxess_control/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
      - id: mypy
        # homeassistant is PINNED for deterministic mypy. It was previously
        # unpinned, so it floated to whatever each environment's Python could
        # install: CI runs Python 3.13 (HA caps at the 2026.2.x line), while a
        # 3.14 dev box floated up to 2026.5.x where async_write_ha_state became
        # @final — flipping a test's ignore code between [method-assign] and
        # [misc]. Pin to 2026.2.3: the newest release whose Requires-Python
        # (>=3.13.2, no upper bound) installs on BOTH 3.13 (CI) and 3.14 (dev).
        # Do NOT bump past the 3.13-compatible line until CI's Python moves —
        # 2026.3.0+ require >=3.14.2 and will fail to install on CI. Bump
        # deliberately, in lockstep with the CI Python version.
        additional_dependencies: [types-requests, responses, pytest, "homeassistant==2026.2.3", voluptuous]
